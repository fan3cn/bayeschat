<!doctype html>
<!--
  Generated by scripts/build-demo.py — do not edit here.
  The film itself is video/promo/, exported by scripts/build-film.py; this shell
  is scripts/demo-shell/index.html. Published from the app repository so
  https://fan3cn.github.io/bayeschat/ plays the film as a page, not a video.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BayesChat — live demo</title>
<meta name="description" content="The BayesChat demo film, played live in the browser: 88 seconds of interface, drawn in HTML. No video file.">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://fan3cn.github.io/bayeschat/">
<meta property="og:type" content="website">
<meta property="og:title" content="BayesChat — live demo">
<meta property="og:description" content="88 seconds of BayesChat, drawn live in the browser. No video file.">
<meta property="og:image" content="https://fan3cn.github.io/bayeschat/film/poster.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://fan3cn.github.io/bayeschat/film/poster.webp">
<style>
  @font-face{
    font-family:"Geist"; font-weight:100 900; font-style:normal; font-display:swap;
    src:url("film/assets/fonts/geist-latin-var.woff2") format("woff2");
  }
  @font-face{
    font-family:"JetBrains Mono"; font-weight:100 800; font-style:normal; font-display:swap;
    src:url("film/assets/fonts/jetbrains-mono-latin-var.woff2") format("woff2");
  }
  :root{
    --paper:#f7f6f3; --paper-2:#ffffff;
    --ink:#0b0b0c; --ink-2:#57564f; --ink-3:#8a8880;
    --line:rgba(11,11,12,.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100dvh;
  }
  .mono{
    font-family:"JetBrains Mono", ui-monospace, monospace;
    font-size:10.5px; font-weight:500; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-3);
  }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  /* ---- header ---------------------------------------------------------- */
  .top{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    gap:18px; padding:16px clamp(16px, 3vw, 30px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:9px; font-size:15px; font-weight:600; letter-spacing:-.02em; }
  .brand svg{ width:17px; height:20px; }
  .claim{ margin-left:4px; }
  .top a{ color:var(--ink-2); text-decoration:none; }
  .top a:hover{ color:var(--ink); }

  /* ---- the film -------------------------------------------------------- */
  .stage{
    flex:1 1 auto; min-height:0; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(10px, 2.2vw, 28px);
    /* the composition is authored on this exact paper, so the two surfaces
       are the same surface and the film has no visible frame */
    background:var(--paper);
  }
  .clip{ position:relative; overflow:hidden; }
  .frame{
    border:0; display:block; background:var(--paper);
    width:1920px; height:1080px;
    transform-origin:0 0;
  }
  .poster{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; background:var(--paper);
  }
  .rotate{
    position:absolute; left:0; right:0; bottom:12px; margin:0;
    text-align:center; display:none;
  }
  /* a 16:9 film on a portrait phone is a strip; say so rather than leaving the
     paper empty and letting people think the page is broken */
  @media (orientation:portrait) and (max-width:700px){
    .rotate{ display:block; }
  }
  .hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; color:var(--ink-2); font-size:14px; max-width:34ch;
    line-height:1.5;
  }

  /* ---- controls -------------------------------------------------------- */
  .bar{
    flex:none; display:flex; align-items:center; gap:clamp(10px, 1.6vw, 18px);
    padding:12px clamp(16px, 3vw, 30px) calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .btn{
    flex:none; width:34px; height:34px; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:var(--ink);
    border:1px solid var(--line); border-radius:0; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .btn:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn svg{ width:13px; height:13px; fill:currentColor; }
  .btn .i-pause{ display:none; }
  .btn[data-state="pause"] .i-play{ display:none; }
  .btn[data-state="pause"] .i-pause{ display:block; }

  .scrub{ flex:1 1 auto; display:flex; align-items:center; min-width:0; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:24px; margin:0; background:transparent; cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:1px; background:var(--line); }
  input[type="range"]::-moz-range-track{ height:1px; background:var(--line); }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:9px; height:9px; margin-top:-4px;
    background:var(--ink); border:0; border-radius:0;
  }
  input[type="range"]::-moz-range-thumb{
    width:9px; height:9px; background:var(--ink); border:0; border-radius:0;
  }
  input[type="range"]:focus-visible{ outline:2px solid var(--ink); outline-offset:4px; }

  .time{ flex:none; font-variant-numeric:tabular-nums; color:var(--ink-3); }

  @media (max-width:620px){
    .claim{ display:none; }
    .time{ letter-spacing:.06em; }
  }
  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }
</style>
</head>
<body>

<header class="top">
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 3.5C20.5 13 15 18.5 8.2 18.5H3.5C3.5 9 9 3.5 17.8 3.5h2.7Z"/>
      <path d="M3.5 20.8C6.2 14.2 10.5 10.2 17.2 7.2" stroke-linecap="round"/>
    </svg>
    BayesChat
    <span class="claim mono">Any model. Any tool. On your device.</span>
  </span>
  <a class="mono" href="https://bayeschat.xyz/">bayeschat.xyz</a>
</header>

<main class="stage" id="stage">
  <div class="clip" id="clip">
    <img class="poster" id="poster" src="film/poster.webp" alt="" width="1920" height="1080">
    <iframe class="frame" id="frame" src="film/index.html" title="BayesChat demo film" width="1920" height="1080" scrolling="no" tabindex="-1"></iframe>
  </div>
  <p class="rotate mono">Turn the phone sideways</p>
  <p class="hint" id="hint" hidden>The film could not start in this browser. Try reloading the page.</p>
</main>

<div class="bar">
  <button class="btn" id="play" type="button" data-state="play" aria-label="Play">
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8 19.5 12 8 19.2Z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.4v16H7zM13.6 4H17v16h-3.4z"/></svg>
  </button>
  <label class="scrub">
    <span class="sr-only">Seek</span>
    <input id="seek" type="range" min="0" max="100" step="0.05" value="0">
  </label>
  <span class="time mono" id="time">0:00 / 1:28</span>
  <button class="btn" id="fs" type="button" aria-label="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"/></svg>
  </button>
</div>

<script src="player.js"></script>
</body>
</html>
